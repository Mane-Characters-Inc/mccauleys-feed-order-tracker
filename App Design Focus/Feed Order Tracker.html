<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feed Order Tracker — Mane Characters</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;900&family=Roboto+Slab:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="_ds/mane-characters-design-system-019e1d97-9285-7c61-8c9f-af498849e5f4/colors_and_type.css" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Roboto', system-ui, sans-serif;
    background:
      radial-gradient(1200px 700px at 50% -10%, #3a2750 0%, transparent 60%),
      #2C1A3E;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  /* hide number input spinners — steppers handle increment */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  input, textarea, button { outline: none; }
  input:focus, textarea:focus { border-color: #69428A !important; box-shadow: 0 0 0 3px rgba(105,66,138,0.18); }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes mcFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes mcRise { from { transform: translateY(24px); } to { transform: translateY(0); } }
</style>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#2C1A3E"/>
    <g transform="translate(30,28)" fill="none" stroke="#108A81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="0" width="34" height="44" rx="4"/>
      <path d="M14 -2h12v6H14z" fill="#108A81" stroke="none"/>
      <path d="M11 22l5 5 9-9"/>
    </g>
  </svg>
</template>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Mane Characters design system bundle (brand components on window) -->
<script src="_ds/mane-characters-design-system-019e1d97-9285-7c61-8c9f-af498849e5f4/_ds_bundle.js"></script>

<!-- frame + tweaks scaffolds -->
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- app -->
<script type="text/babel" src="app-data.jsx"></script>
<script type="text/babel" src="app-ui.jsx"></script>
<script type="text/babel" src="app-screens-week.jsx"></script>
<script type="text/babel" src="app-screens-more.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "layout": "cards",
  "chrome": "purple",
  "overrideColor": "#108A81",
  "oilReminder": true
}/*EDITMODE-END*/;

function FeedApp() {
  const [state, setStateRaw] = React.useState(() => loadState());
  const setState = (s) => setStateRaw(s);
  const [tab, setTab] = React.useState('week');
  const [view, setView] = React.useState(null); // 'message'
  const [toastMsg, setToastMsg] = React.useState(null);
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [scale, setScale] = React.useState(1);

  const toast = (m) => { setToastMsg(m); clearTimeout(window.__mcToastT); window.__mcToastT = setTimeout(() => setToastMsg(null), 1900); };

  // scale device to fit viewport
  React.useLayoutEffect(() => {
    const W = 402, H = 874;
    const fit = () => {
      const s = Math.min((window.innerWidth - 24) / W, (window.innerHeight - 24) / H, 1.05);
      setScale(Math.max(0.4, s));
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  const chrome = t.chrome === 'purple' ? C.purple : C.purpleDeep;

  const setBuffer = (v) => { const s = JSON.parse(JSON.stringify(state)); s.settings.buffer = Math.max(0, Math.round(v)); saveState(s); setState(s); };

  const startNext = () => {
    const s = JSON.parse(JSON.stringify(state));
    s.weeks.push(startNewWeek(s));
    saveState(s); setState(s); setTab('week'); setView(null);
    toast('Next week started');
  };

  // top bar config
  let title, subtitle, onBack = null, showTabs = true, content;
  if (view === 'message') {
    title = 'Order Message'; subtitle = 'Review \u00b7 edit \u00b7 send'; onBack = () => setView(null); showTabs = false;
    content = <MessageScreen state={state} setState={setState} onBack={() => setView(null)} onSent={() => { setView(null); setTab('week'); toast('Order marked sent'); }} toast={toast} />;
  } else if (tab === 'week') {
    title = 'Feed Order'; subtitle = 'Weekly · McCauley\u2019s';
    content = <ThisWeekScreen state={state} setState={setState} layout={t.layout} overrideColor={t.overrideColor} oilReminder={t.oilReminder} onReview={() => setView('message')} onStartNext={startNext} toast={toast} />;
  } else if (tab === 'history') {
    title = 'History'; subtitle = 'Every past order';
    content = <HistoryScreen state={state} setState={setState} toast={toast} />;
  } else if (tab === 'backup') {
    title = 'Backup & Export'; subtitle = 'Offline · portable';
    content = <BackupScreen state={state} setState={setState} toast={toast} />;
  } else {
    title = 'Settings'; subtitle = 'Configuration';
    const bufferControl = (
      <input type="range" min="0" max="6" step="1" value={state.settings.buffer}
        onChange={(e) => setBuffer(Number(e.target.value))}
        style={{ width: '100%', accentColor: C.teal }} />
    );
    content = <SettingsScreen state={state} setState={setState} toast={toast} bufferControl={bufferControl} />;
  }

  const screenKey = view === 'message' ? 'message' : tab;

  return (
    <div style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
      <IOSDevice>
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: C.off, position: 'relative' }}>
          <TopBar title={title} subtitle={subtitle} onBack={onBack} chrome={chrome} />
          <div key={screenKey} style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', animation: 'mcFade 220ms ease' }}>
            {content}
          </div>
          {showTabs && <TabBar active={tab} onChange={(id) => { setTab(id); setView(null); }} chrome={chrome} />}
          <Toast msg={toastMsg} />
        </div>
      </IOSDevice>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Worksheet" />
        <TweakRadio label="Layout" value={t.layout}
          options={[{ value: 'cards', label: 'Cards' }, { value: 'grid', label: 'Spreadsheet' }]}
          onChange={(v) => setTweak('layout', v)} />
        <TweakSlider label="Safety buffer" value={state.settings.buffer} min={0} max={6} step={1} unit=" bags"
          onChange={(v) => setBuffer(v)} />

        <TweakSection label="Appearance" />
        <TweakRadio label="App chrome" value={t.chrome}
          options={[{ value: 'deep', label: 'Deep purple' }, { value: 'purple', label: 'Purple' }]}
          onChange={(v) => setTweak('chrome', v)} />
        <TweakColor label="Override flag" value={t.overrideColor}
          options={['#C9A84C', '#108A81', '#69428A', '#C0492F']}
          onChange={(v) => setTweak('overrideColor', v)} />

        <TweakSection label="Rice Bran Oil" />
        <TweakToggle label="Low-oil reminder" value={t.oilReminder}
          onChange={(v) => setTweak('oilReminder', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<FeedApp />);
</script>
</body>
</html>
