name: Build & Release Android APK

# Builds a signed release APK and publishes it to a GitHub Release.
# Triggers on a version tag (e.g. v1.0.0), or manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for a manual build (e.g. 1.0.0)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write   # needed to create the Release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build-tools
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Derive version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${{ github.event.inputs.version }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building version $NAME (code ${GITHUB_RUN_NUMBER})"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Capacitor sync (bundle web assets into the native project)
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build signed release APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage APK with a friendly name
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "$RUNNER_TEMP/out/feed-order-tracker-${{ steps.ver.outputs.name }}.apk"
          ls -la "$RUNNER_TEMP/out"

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: feed-order-tracker-apk
          path: ${{ runner.temp }}/out/*.apk

      - name: Publish GitHub Release (tag builds only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Feed Order Tracker ${{ steps.ver.outputs.name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ runner.temp }}/out/*.apk
          body: |
            **Feed Order Tracker for Android** — version ${{ steps.ver.outputs.name }}

            Download the `.apk` below and install it on any Android phone.
            Runs fully offline; all data stays on the device.

            First install: when Android asks, allow installing from this source, then tap Install.
